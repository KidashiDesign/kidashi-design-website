<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hideout Georgia — Farbanimation</title>
<style>body,html{margin:0;padding:0;width:100%;height:100%;background:#467b11;overflow:hidden}#stage{position:fixed;inset:0;background:#467b11}.col{position:absolute;top:0;height:100%;overflow:hidden;background:#467b11}.col img{position:absolute;left:0;width:100%;display:block;object-fit:cover}</style>
</head>
<body>
<div id="stage">
  <div class="col" id="col-0" style="left:0%; width:25%;"><img src="../../images/portfolio/hideout-georgia/anim/loop-col-0.webp" alt=""></div>
  <div class="col" id="col-1" style="left:25%; width:25%;"><img src="../../images/portfolio/hideout-georgia/anim/loop-col-1.webp" alt=""></div>
  <div class="col" id="col-2" style="left:50%; width:25%;"><img src="../../images/portfolio/hideout-georgia/anim/loop-col-2.webp" alt=""></div>
  <div class="col" id="col-3" style="left:75%; width:25%;"><img src="../../images/portfolio/hideout-georgia/anim/loop-col-3.webp" alt=""></div>
</div>
<script>var OVERSIZE=1.18,COLS=[{amp:34,period:7,phase:0},{amp:48,period:5.4,phase:1.6},{amp:40,period:8.2,phase:3.1},{amp:52,period:6.1,phase:4.5}],stage=document.getElementById("stage"),els=COLS.map(function(e,t){return{cfg:e,col:document.getElementById("col-"+t),img:document.getElementById("col-"+t).querySelector("img")}});function layout(){var e=stage.clientHeight;els.forEach(function(t){t.img.style.height=e*OVERSIZE+"px",t.baseTop=-(e*OVERSIZE-e)/2})}var running=!0;function tick(e){if(running){var t=e/1e3;els.forEach(function(e){var n=e.cfg.amp*Math.sin(2*t*Math.PI/e.cfg.period+e.cfg.phase);e.img.style.top=e.baseTop+n+"px"}),requestAnimationFrame(tick)}}window.addEventListener("resize",layout),document.addEventListener("visibilitychange",function(){(running=!document.hidden)&&requestAnimationFrame(tick)}),layout(),requestAnimationFrame(tick);</script>
</body>
</html>
