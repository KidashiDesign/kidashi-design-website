<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hideout Georgia — Outro</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body,html{width:100%;height:100%;overflow:hidden;background:#c4de44}.stage{position:fixed;inset:0;overflow:hidden;background:#c4de44;opacity:0;animation:bgIn .6s ease-out forwards}@keyframes bgIn{to{opacity:1}}.logo{position:absolute;left:50%;top:50%;width:40%;max-width:760px;transform:translate(-50%,calc(-50% + 24px)) scale(.85);opacity:0;animation:logoIn 1s cubic-bezier(.34,1.56,.64,1) .3s forwards,logoOut 1.4s cubic-bezier(.55,0,1,.45) 3.2s forwards}@keyframes logoIn{to{transform:translate(-50%,-50%) scale(1);opacity:1}}@keyframes logoOut{to{transform:translate(-50%,calc(-50% - 40px)) scale(1.35);opacity:0;filter:blur(18px)}}.logo img{display:block;width:100%;height:auto}@media (prefers-reduced-motion:reduce){.logo,.stage{animation-duration:10ms!important;animation-delay:0s!important}}</style>
</head>
<body>
<div class="stage">
  <div class="logo"><img src="../../images/portfolio/hideout-georgia/anim/outro-logo.webp" alt="Hideout Georgia"></div>
</div>
</body>
</html>
