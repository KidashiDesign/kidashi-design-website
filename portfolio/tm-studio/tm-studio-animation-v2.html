<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>TM Studio — Animation</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #efe2c9;
    overflow: hidden;
  }
  .stage {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    background: #efe2c9;
  }
  .circle {
    position: absolute;
    border-radius: 50%;
    opacity: 0;
    transform: scale(0.9);
    animation: circle-in 1.4s ease-out forwards;
  }
  .circle--1 {
    width: 55%;
    aspect-ratio: 1;
    left: 6%;
    top: 12%;
    background: #e0a566;
    opacity: 0.4;
  }
  .circle--2 {
    width: 62%;
    aspect-ratio: 1;
    right: 4%;
    bottom: 4%;
    background: #8da6b6;
    opacity: 0.38;
  }
  .circle--outline {
    width: 68%;
    aspect-ratio: 1;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    border: 3px solid #6b5644;
    background: none;
    opacity: 0.25;
  }
  @keyframes circle-in {
    from { opacity: 0; transform: scale(0.9); }
    to   { opacity: var(--target-opacity, 0.4); transform: scale(1); }
  }
  .circle--1 { --target-opacity: 0.4; animation-delay: 0s; }
  .circle--2 { --target-opacity: 0.38; animation-delay: 0.15s; }
  .circle--outline {
    animation: outline-in 1.4s ease-out forwards;
    animation-delay: 0.3s;
  }
  @keyframes outline-in {
    from { opacity: 0; transform: translate(-50%, -50%) scale(0.9); }
    to   { opacity: 0.25; transform: translate(-50%, -50%) scale(1); }
  }

  .monogram {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%) scale(0.85);
    font-family: Georgia, 'Times New Roman', serif;
    font-style: italic;
    font-weight: 700;
    font-size: clamp(4rem, 22vw, 14rem);
    color: #4a3b2e;
    opacity: 0;
    animation: monogram-in 1.1s ease-out forwards;
    animation-delay: 0.6s;
    white-space: nowrap;
  }
  @keyframes monogram-in {
    from { opacity: 0; transform: translate(-50%, -50%) scale(0.85); }
    to   { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  }

  /* dezente Endlos-Loop-Bewegung, startet nach dem Intro */
  .circle--1 { animation: circle-in 1.4s ease-out forwards, drift-1 9s ease-in-out 1.4s infinite; }
  .circle--2 { animation: circle-in 1.4s ease-out forwards 0.15s, drift-2 11s ease-in-out 1.55s infinite; }

  @keyframes drift-1 {
    0%, 100% { transform: scale(1) translate(0, 0); }
    50%      { transform: scale(1.04) translate(1.5%, 1%); }
  }
  @keyframes drift-2 {
    0%, 100% { transform: scale(1) translate(0, 0); }
    50%      { transform: scale(1.05) translate(-1.5%, -1%); }
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="circle circle--1"></div>
    <div class="circle circle--2"></div>
    <div class="circle circle--outline"></div>
    <div class="monogram">TM</div>
  </div>
</body>
</html>
