<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Woofles — Hero Animation</title>
<script>
  if (location.search.indexOf('tile') !== -1) {
    document.documentElement.classList.add('tile-mode');
  }
</script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #201206; }
  .tile-mode, .tile-mode body { background: #050403; }
  a { color: #fbf3e6; text-decoration: none; }

  .stage {
    --cocoa-950: #201206;
    --cocoa-900: #331b0d;
    --cocoa-800: #4a2712;
    --cream: #fbf3e6;
    --caramel: #d9973f;
    --caramel-light: #eab55e;
    --blush: #e6a3ae;
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--cocoa-950);
    color: var(--cream);
  }
  .tile-mode .stage { background: #050403; }
  .paused .drift { animation-play-state: paused !important; }
  .paused .logo-mark { animation-play-state: paused !important; }

  @keyframes zoomOut { from { transform: scale(1.28); } to { transform: scale(1); } }
  @keyframes ambientDrift { 0% { transform: translate(0,0); } 100% { transform: translate(-2.5%,-2%); } }

  /* Full-hero background: slow pan/zoom cooking footage */
  .bg-wrap { position: absolute; inset: -6%; z-index: 0; animation: ambientDrift 16s ease-in-out infinite alternate; }
  .bg-inner {
    position: absolute; inset: 0;
    animation: zoomOut 3.2s cubic-bezier(.16,.8,.3,1) both;
    background: radial-gradient(ellipse at 30% 25%, var(--cocoa-800), var(--cocoa-950) 75%);
  }
  .bg-inner video { width: 100%; height: 100%; object-fit: cover; display: block; filter: saturate(0.55) brightness(0.92); }

  /* Tile background: static-framed cooking footage, matches the portfolio grid preview */
  .bg-video--tile { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; }

  video::-webkit-media-controls,
  video::-webkit-media-controls-start-playback-button,
  video::-webkit-media-controls-play-button,
  video::-internal-media-controls-overlay-cast-button { display: none !important; -webkit-appearance: none; }

  .fade-bottom {
    position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background:
      linear-gradient(180deg, rgba(32,18,6,0.50) 0%, rgba(32,18,6,0.30) 34%, rgba(32,18,6,0.62) 64%, rgba(32,18,6,0.94) 100%),
      radial-gradient(ellipse 80% 65% at 50% 45%, rgba(32,18,6,0) 40%, rgba(32,18,6,0.6) 100%);
  }
  .glow-top {
    position: absolute; inset: 0; z-index: 1; pointer-events: none; mix-blend-mode: screen; opacity: .5;
    background: radial-gradient(ellipse 55% 45% at 78% 12%, rgba(217,151,63,0.35), rgba(217,151,63,0) 70%);
  }

  /* Logo-mark loop — centered, textless hero */
  .logo-mark {
    position: absolute;
    z-index: 2;
    left: 50%;
    top: 50%;
    width: min(24vw, 320px);
    aspect-ratio: 1 / 1;
    transform-origin: center;
    animation: logoLoop 10s infinite;
    will-change: transform, filter, opacity;
    pointer-events: none;
  }
  .logo-mark img { width: 100%; height: 100%; object-fit: contain; display: block; }

  @keyframes logoLoop {
    0%   { opacity: 0;    transform: translate(-50%,-50%) scale(0.76); filter: blur(18px) drop-shadow(0 14px 46px rgba(0,0,0,0)); animation-timing-function: cubic-bezier(.33,1,.68,1); }
    18%  { opacity: 1;    transform: translate(-50%,-50%) scale(1);    filter: blur(0px)  drop-shadow(0 14px 46px rgba(0,0,0,.4)); animation-timing-function: ease-in-out; }
    35%  { opacity: 1;    transform: translate(-50%,-50%) scale(1.02); filter: blur(0px)  drop-shadow(0 14px 46px rgba(0,0,0,.4)); animation-timing-function: ease-in-out; }
    50%  { opacity: 1;    transform: translate(-50%,-50%) scale(1);    filter: blur(0px)  drop-shadow(0 14px 46px rgba(0,0,0,.4)); animation-timing-function: ease-in-out; }
    62%  { opacity: 1;    transform: translate(-50%,-50%) scale(1);    filter: blur(0px)  drop-shadow(0 14px 46px rgba(0,0,0,.4)); animation-timing-function: cubic-bezier(.32,0,.67,0); }
    80%  { opacity: 0;    transform: translate(-50%,-50%) scale(1.16); filter: blur(14px) drop-shadow(0 14px 46px rgba(0,0,0,0));   animation-timing-function: linear; }
    100% { opacity: 0;    transform: translate(-50%,-50%) scale(1.16); filter: blur(14px) drop-shadow(0 14px 46px rgba(0,0,0,0)); }
  }

  /* Tile mode: only the video + morphing logo mark, centered */
  .tile-mode .bg-wrap,
  .tile-mode .fade-bottom,
  .tile-mode .glow-top { display: none !important; }
  .tile-mode .bg-video--tile { display: block; }
  .tile-mode .logo-mark { width: min(38%, 280px); }

  @media (prefers-reduced-motion: reduce) {
    .bg-wrap, .logo-mark { animation: none !important; }
    .logo-mark { opacity: 1; transform: translate(-50%,-50%); }
  }

  @media (max-width: 700px) {
    .logo-mark { width: min(46vw, 220px); }
  }
</style>
</head>
<body>
<div class="stage" id="stage">

  <div class="bg-wrap">
    <div class="bg-inner">
      <video class="bg-video--hero" muted loop playsinline preload="none">
        <source src="../../images/portfolio/woofles/woofles-waffle-cooking.webm" type="video/webm" />
        <source src="../../images/portfolio/woofles/woofles-waffle-cooking.mp4" type="video/mp4" />
      </video>
    </div>
  </div>
  <video class="bg-video--tile" muted loop playsinline preload="none">
    <source src="../../images/portfolio/woofles/woofles-tile-cooking.webm" type="video/webm" />
    <source src="../../images/portfolio/woofles/woofles-tile-cooking.mp4" type="video/mp4" />
  </video>

  <div class="fade-bottom"></div>
  <div class="glow-top"></div>

  <div class="logo-mark">
    <img src="../../images/portfolio/woofles/woofles-tile-logo.png" alt="" aria-hidden="true">
  </div>

</div>
<script>
(function () {
  "use strict";
  var stage = document.getElementById('stage');
  var isTile = document.documentElement.classList.contains('tile-mode');
  var activeVideo = stage.querySelector(isTile ? '.bg-video--tile' : '.bg-video--hero');

  function tryPlay () {
    if (activeVideo) activeVideo.play().catch(function(){});
  }
  if (activeVideo) {
    activeVideo.preload = 'auto';
    tryPlay();
  }
  document.addEventListener('touchstart', tryPlay, { once: true, passive: true });

  document.addEventListener('visibilitychange', function () {
    stage.classList.toggle('paused', document.hidden);
    if (!activeVideo) return;
    if (document.hidden) { activeVideo.pause(); } else { activeVideo.play().catch(function(){}); }
  });
})();
</script>
</body>
</html>
