<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Woofles — Logo Morph Loop</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #050403; }

  .stage { position: relative; width: 100%; height: 100%; overflow: hidden; background: #050403; }
  .paused .logo-mark { animation-play-state: paused !important; }
  .paused video { animation-play-state: paused !important; }

  .bg-video {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; display: block;
  }
  .bg-video::-webkit-media-controls,
  .bg-video::-webkit-media-controls-start-playback-button,
  .bg-video::-webkit-media-controls-play-button,
  .bg-video::-internal-media-controls-overlay-cast-button { display: none !important; -webkit-appearance: none; }

  .logo-mark {
    position: absolute;
    left: 50%; top: 50%;
    width: min(38%, 280px);
    aspect-ratio: 1 / 1;
    transform-origin: center;
    animation: logoLoop 10s infinite;
    will-change: transform, filter, opacity;
  }
  .logo-mark img { width: 100%; height: 100%; object-fit: contain; display: block; }

  @keyframes logoLoop {
    0%   { opacity: 0;    transform: translate(-50%,-50%) scale(0.76); filter: blur(18px) drop-shadow(0 14px 46px rgba(0,0,0,0)); animation-timing-function: cubic-bezier(.33,1,.68,1); }
    18%  { opacity: 1;    transform: translate(-50%,-50%) scale(1);    filter: blur(0px)  drop-shadow(0 14px 46px rgba(0,0,0,.4)); animation-timing-function: ease-in-out; }
    35%  { opacity: 1;    transform: translate(-50%,-50%) scale(1.02); filter: blur(0px)  drop-shadow(0 14px 46px rgba(0,0,0,.4)); animation-timing-function: ease-in-out; }
    50%  { opacity: 1;    transform: translate(-50%,-50%) scale(1);    filter: blur(0px)  drop-shadow(0 14px 46px rgba(0,0,0,.4)); animation-timing-function: ease-in-out; }
    62%  { opacity: 1;    transform: translate(-50%,-50%) scale(1);    filter: blur(0px)  drop-shadow(0 14px 46px rgba(0,0,0,.4)); animation-timing-function: cubic-bezier(.32,0,.67,0); }
    80%  { opacity: 0;    transform: translate(-50%,-50%) scale(1.16); filter: blur(14px) drop-shadow(0 14px 46px rgba(0,0,0,0));   animation-timing-function: linear; }
    100% { opacity: 0;    transform: translate(-50%,-50%) scale(1.16); filter: blur(14px) drop-shadow(0 14px 46px rgba(0,0,0,0)); }
  }

  @media (prefers-reduced-motion: reduce) {
    .logo-mark { animation: none !important; opacity: 1; transform: translate(-50%,-50%) scale(1); }
  }
</style>
</head>
<body>
<div class="stage" id="stage">
  <video class="bg-video" autoplay muted loop playsinline preload="auto">
    <source src="../../images/portfolio/woofles/woofles-tile-cooking.webm" type="video/webm">
    <source src="../../images/portfolio/woofles/woofles-tile-cooking.mp4" type="video/mp4">
  </video>
  <div class="logo-mark">
    <img src="../../images/portfolio/woofles/woofles-tile-logo.png" alt="" aria-hidden="true">
  </div>
</div>
<script>
(function () {
  "use strict";
  var stage = document.getElementById('stage');
  var video = document.querySelector('video');
  if (video) {
    var tryPlay = function () { video.play().catch(function(){}); };
    tryPlay();
    document.addEventListener('touchstart', tryPlay, { once: true, passive: true });
  }
  document.addEventListener('visibilitychange', function () {
    stage.classList.toggle('paused', document.hidden);
    if (!video) return;
    if (document.hidden) { video.pause(); } else { video.play().catch(function(){}); }
  });
})();
</script>
</body>
</html>
