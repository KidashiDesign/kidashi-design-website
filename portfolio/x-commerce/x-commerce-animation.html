<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>X-Commerce — Hero Animation</title>
<script>
  if (location.search.indexOf('tile') !== -1) {
    document.documentElement.classList.add('tile-mode');
  }
</script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #050505; }

  .stage { position: relative; width: 100%; height: 100%; overflow: hidden; background: #050505; }
  .paused video { animation-play-state: paused !important; }

  .bg-video { position: absolute; inset: 0; z-index: 0; }
  .bg-video video {
    width: 100%; height: 100%; object-fit: cover; display: block;
  }
  /* hide native play button / controls bar entirely */
  .bg-video video::-webkit-media-controls,
  .bg-video video::-webkit-media-controls-panel,
  .bg-video video::-webkit-media-controls-start-playback-button,
  .bg-video video::-webkit-media-controls-play-button,
  .bg-video video::-internal-media-controls-overlay-cast-button,
  .bg-video video::-webkit-media-controls-overlay-play-button,
  .bg-video video::-internal-media-controls-overlay-play-button {
    display: none !important;
    -webkit-appearance: none;
  }

</style>
</head>
<body>
<div class="stage" id="stage">

  <div class="bg-video">
    <video autoplay muted loop playsinline preload="auto" disablepictureinpicture controlslist="nodownload noplaybackrate nofullscreen">
      <source src="/images/portfolio/x-commerce/0_Gaming_Virtual_Reality_1920x1080.mp4" type="video/mp4" />
    </video>
  </div>

</div>
<script>
(function () {
  "use strict";
  var stage = document.getElementById('stage');
  var video = document.querySelector('video');
  if (video) {
    var tryPlay = function () { video.play().catch(function(){}); };
    tryPlay();
    document.addEventListener('touchstart', tryPlay, { once: true, passive: true });
  }
  document.addEventListener('visibilitychange', function () {
    stage.classList.toggle('paused', document.hidden);
    if (!video) return;
    if (document.hidden) { video.pause(); } else { video.play().catch(function(){}); }
  });
})();
</script>
</body>
</html>
