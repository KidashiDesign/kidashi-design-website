<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Selvoma Animation</title>
<script>
  if (new URLSearchParams(location.search).get('tile') === '1') {
    document.documentElement.classList.add('sv-tile');
  }
</script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #050504; }
  html.sv-tile, html.sv-tile body { background: #474F1E; }

  @keyframes sv-orb-drift-a {
    0%   { transform: translate(-6%, -4%) scale(1); }
    50%  { transform: translate(10%, 8%) scale(1.15); }
    100% { transform: translate(-6%, -4%) scale(1); }
  }
  @keyframes sv-orb-drift-b {
    0%   { transform: translate(8%, 6%) scale(1.1); }
    50%  { transform: translate(-10%, -10%) scale(0.95); }
    100% { transform: translate(8%, 6%) scale(1.1); }
  }
  @keyframes sv-orb-drift-c {
    0%   { transform: translate(-4%, 8%) scale(0.95); }
    50%  { transform: translate(6%, -12%) scale(1.1); }
    100% { transform: translate(-4%, 8%) scale(0.95); }
  }

  .sv-bg {
    position: absolute; inset: -15%; width: 130%; height: 130%;
    overflow: hidden;
  }
  .sv-orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(50px);
    will-change: transform;
  }
  .sv-orb--a {
    top: -10%; left: -8%; width: 65%; height: 65%;
    background: radial-gradient(circle, rgba(150,196,80,0.55) 0%, rgba(150,196,80,0) 70%);
    animation: sv-orb-drift-a 22s ease-in-out infinite;
  }
  .sv-orb--b {
    bottom: -15%; right: -10%; width: 70%; height: 70%;
    background: radial-gradient(circle, rgba(233,196,106,0.4) 0%, rgba(233,196,106,0) 70%);
    animation: sv-orb-drift-b 28s ease-in-out infinite;
  }
  .sv-orb--c {
    top: 30%; left: 35%; width: 55%; height: 55%;
    background: radial-gradient(circle, rgba(38,52,15,0.7) 0%, rgba(38,52,15,0) 70%);
    animation: sv-orb-drift-c 34s ease-in-out infinite;
  }

  @keyframes sv-slide-cycle {
    0%   { opacity: 0; transform: scale(1.04); filter: blur(10px); }
    2%   { opacity: 1; transform: scale(1);    filter: blur(0px); }
    5%   { opacity: 1; transform: scale(1);    filter: blur(0px); }
    7%   { opacity: 0; transform: scale(0.96); filter: blur(10px); }
    100% { opacity: 0; transform: scale(0.96); filter: blur(10px); }
  }

  .sv-slide {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: contain;
    animation: sv-slide-cycle 150s ease infinite;
    will-change: opacity, transform, filter;
  }

  @media (prefers-reduced-motion: reduce) {
    .sv-orb, .sv-slide { animation: none !important; }
    .sv-slide { opacity: 0; }
    .sv-slide:first-of-type { opacity: 1; }
  }

  html.sv-tile .sv-bg-wrap { background: #474F1E !important; }
</style>
</head>
<body>

<div class="sv-bg-wrap" style="position: fixed; inset: 0; overflow: hidden; background: #050504;">

  <div class="sv-bg">
    <div class="sv-orb sv-orb--a"></div>
    <div class="sv-orb sv-orb--b"></div>
    <div class="sv-orb sv-orb--c"></div>
  </div>

  <div style="position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.62) 100%); pointer-events: none;"></div>

  <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 0 10px; box-sizing: border-box;">
    <div style="position: relative; width: 100%; height: 100%;">
  <img src="../../images/portfolio/selvoma/animation/selvoma-01.webp" alt="" class="sv-slide" style="animation-delay: -0.0s;" />
  <img src="../../images/portfolio/selvoma/animation/selvoma-02.webp" alt="" class="sv-slide" style="animation-delay: -7.5s;" />
  <img src="../../images/portfolio/selvoma/animation/selvoma-03.webp" alt="" class="sv-slide" style="animation-delay: -15.0s;" />

  <img src="../../images/portfolio/selvoma/animation/selvoma-05.webp" alt="" class="sv-slide" style="animation-delay: -30.0s;" />
  <img src="../../images/portfolio/selvoma/animation/selvoma-06.webp" alt="" class="sv-slide" style="animation-delay: -37.5s;" />
  <img src="../../images/portfolio/selvoma/animation/selvoma-07.webp" alt="" class="sv-slide" style="animation-delay: -45.0s;" />
  <img src="../../images/portfolio/selvoma/animation/selvoma-08.webp" alt="" class="sv-slide" style="animation-delay: -52.5s;" />
  <img src="../../images/portfolio/selvoma/animation/selvoma-09.webp" alt="" class="sv-slide" style="animation-delay: -60.0s;" />
  <img src="../../images/portfolio/selvoma/animation/selvoma-10.webp" alt="" class="sv-slide" style="animation-delay: -67.5s;" />
  <img src="../../images/portfolio/selvoma/animation/selvoma-11.webp" alt="" class="sv-slide" style="animation-delay: -75.0s;" />
  <img src="../../images/portfolio/selvoma/animation/selvoma-12.webp" alt="" class="sv-slide" style="animation-delay: -82.5s;" />
  <img src="../../images/portfolio/selvoma/animation/selvoma-13.webp" alt="" class="sv-slide" style="animation-delay: -90.0s;" />
  <img src="../../images/portfolio/selvoma/animation/selvoma-14.webp" alt="" class="sv-slide" style="animation-delay: -97.5s;" />

  <img src="../../images/portfolio/selvoma/animation/selvoma-17.webp" alt="" class="sv-slide" style="animation-delay: -120.0s;" />
  <img src="../../images/portfolio/selvoma/animation/selvoma-18.webp" alt="" class="sv-slide" style="animation-delay: -127.5s;" />
  <img src="../../images/portfolio/selvoma/animation/selvoma-19.webp" alt="" class="sv-slide" style="animation-delay: -135.0s;" />
  <img src="../../images/portfolio/selvoma/animation/selvoma-20.webp" alt="" class="sv-slide" style="animation-delay: -142.5s;" />
    </div>
  </div>

</div>

</body>
</html>
