<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Selvoma Animation</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #050504; }

  @keyframes sv-bg-zoom-blur {
    0%   { transform: scale(1);    filter: blur(0px) brightness(0.82); }
    50%  { transform: scale(1.16); filter: blur(7px) brightness(0.68); }
    100% { transform: scale(1);    filter: blur(0px) brightness(0.82); }
  }

  @keyframes sv-slide-cycle {
    0%   { opacity: 0; transform: scale(1.04); filter: blur(10px); }
    2%   { opacity: 1; transform: scale(1);    filter: blur(0px); }
    5%   { opacity: 1; transform: scale(1);    filter: blur(0px); }
    7%   { opacity: 0; transform: scale(0.96); filter: blur(10px); }
    100% { opacity: 0; transform: scale(0.96); filter: blur(10px); }
  }

  .sv-bg {
    position: absolute; top: -6%; left: -6%; width: 112%; height: 112%;
    object-fit: cover;
    animation: sv-bg-zoom-blur 26s ease-in-out infinite;
  }

  .sv-slide {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: contain;
    animation: sv-slide-cycle 150s ease infinite;
    will-change: opacity, transform, filter;
  }

  @media (prefers-reduced-motion: reduce) {
    .sv-bg, .sv-slide { animation: none !important; }
    .sv-slide { opacity: 0; }
    .sv-slide:first-of-type { opacity: 1; }
  }
</style>
</head>
<body>

<div style="position: fixed; inset: 0; overflow: hidden; background: #050504;">

  <img src="../../images/portfolio/selvoma/animation/background.webp" alt="" class="sv-bg" />

  <div style="position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.62) 100%); pointer-events: none;"></div>

  <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 4vmin; box-sizing: border-box;">
    <div style="position: relative; width: min(72vw, 1020px); height: min(60vh, 728px);">
  <img src="../../images/portfolio/selvoma/animation/selvoma-01.webp" alt="" class="sv-slide" style="animation-delay: -0.0s;" />
