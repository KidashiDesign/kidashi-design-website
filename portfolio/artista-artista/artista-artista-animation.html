<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Artista Artista — Animation Reel</title>
<script>
  if (location.search.indexOf('tile') !== -1) {
    document.documentElement.classList.add('tile-mode');
  }
</script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
  body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
  .tile-mode .hide-in-tile { visibility: hidden !important; }

  .stage {
    position: relative;
    width: 100vw;
    height: 100dvh;
    overflow: hidden;
    background: #08070a;
    --d: 42s;
  }
  .scene { position: absolute; inset: 0; overflow: hidden; animation-duration: var(--d); animation-timing-function: linear; animation-iteration-count: infinite; }

  /* ---- Scene visibility windows (6 scenes stitched into one 42s master loop) ---- */
  /* Crossfades: each boundary overlaps ~1s so the outgoing and incoming scene blend directly — no black hold between scenes. */
  @keyframes s1Window { 0% { opacity: 0.5; } 1.19% { opacity: 1; } 15.48% { opacity: 1; } 17.86% { opacity: 0; } 98.81% { opacity: 0; } 100% { opacity: 0.5; } }
  @keyframes s2Window { 0% { opacity: 0; } 15.48% { opacity: 0; } 17.86% { opacity: 1; } 32.14% { opacity: 1; } 34.52%, 100% { opacity: 0; } }
  @keyframes s3Window { 0% { opacity: 0; } 32.14% { opacity: 0; } 34.52% { opacity: 1; } 48.81% { opacity: 1; } 51.19%, 100% { opacity: 0; } }
  @keyframes s4Window { 0% { opacity: 0; } 48.81% { opacity: 0; } 51.19% { opacity: 1; } 65.48% { opacity: 1; } 67.86%, 100% { opacity: 0; } }
  @keyframes s5Window { 0% { opacity: 0; } 65.48% { opacity: 0; } 67.86% { opacity: 1; } 82.14% { opacity: 1; } 84.52%, 100% { opacity: 0; } }
  @keyframes s6Window { 0% { opacity: 0.5; } 1.19% { opacity: 0; } 82.14% { opacity: 0; } 84.52% { opacity: 1; } 98.81% { opacity: 1; } 100% { opacity: 0.5; } }

  /* All inner animations below are pre-computed onto the SAME 42s master clock as the
     windows above, so every scene's entrance lands exactly at its window's fade-in —
     no drift, ever, on repeat loops. */

  @keyframes s1BgReveal {
    0% { transform: scale(1.03); filter: blur(3px); }
    1.19% { transform: scale(1); filter: blur(0px); }
    15.48% { transform: scale(1.015); filter: blur(0px); }
    17.86% { transform: scale(1.06); filter: blur(5px); }
    98.81% { transform: scale(1.1); filter: blur(6px); }
    100% { transform: scale(1.03); filter: blur(3px); }
  }
  @keyframes s1LogoMorph {
    0% { transform: scale(0.85); filter: blur(8px); }
    1.19% { transform: scale(1); filter: blur(0px); }
    15.48% { transform: scale(1); filter: blur(0px); }
    17.86% { transform: scale(1.08); filter: blur(6px); }
    98.81% { transform: scale(0.85); filter: blur(10px); }
    100% { transform: scale(0.85); filter: blur(8px); }
  }

  @keyframes s2PhotoMorph {
    0%, 15.48% { transform: scale(0.92); filter: blur(10px); }
    17.86%, 32.14% { transform: scale(1); filter: blur(0px); }
    34.52%, 100% { transform: scale(0.92); filter: blur(10px); }
  }
  @keyframes s2BgBreathe { 0%, 100% { filter: blur(0px) brightness(1); } 50% { filter: blur(12px) brightness(0.93); } }

  @keyframes s3LogoReveal {
    0%, 34.52% { transform: scale(0.4) rotate(-30deg); filter: blur(10px); }
    40% { transform: scale(1) rotate(0deg); filter: blur(0px); }
    48.81% { transform: scale(1) rotate(0deg); filter: blur(0px); }
    51.19% { transform: scale(0.92) rotate(6deg); filter: blur(6px); }
    100% { transform: scale(0.4) rotate(-30deg); filter: blur(10px); }
  }
  @keyframes s3Spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

  @keyframes s4Photo1 { 0%, 51.19% { opacity: 0; transform: scale(0.9); } 53% { opacity: 1; transform: scale(1); } 65.48% { opacity: 1; transform: scale(1); } 67.86%, 100% { opacity: 0; transform: scale(0.9); } }
  @keyframes s4Photo2 { 0%, 51.79% { opacity: 0; transform: scale(0.9); } 53.6% { opacity: 1; transform: scale(1); } 65.48% { opacity: 1; transform: scale(1); } 67.86%, 100% { opacity: 0; transform: scale(0.9); } }
  @keyframes s4Photo3 { 0%, 52.39% { opacity: 0; transform: scale(0.9); } 54.2% { opacity: 1; transform: scale(1); } 65.48% { opacity: 1; transform: scale(1); } 67.86%, 100% { opacity: 0; transform: scale(0.9); } }
  @keyframes s4Photo4 { 0%, 52.99% { opacity: 0; transform: scale(0.9); } 54.8% { opacity: 1; transform: scale(1); } 65.48% { opacity: 1; transform: scale(1); } 67.86%, 100% { opacity: 0; transform: scale(0.9); } }

  @keyframes s5BgFadeIn { 0%, 65.48% { transform: scale(1.04); } 70%, 82.14% { transform: scale(1); } 100% { transform: scale(1.04); } }
  @keyframes s5TextMorph {
    0%, 67.86% { opacity: 0; filter: blur(14px); transform: translateY(10px) scale(0.98); }
    70% { opacity: 1; filter: blur(0px); transform: translateY(0) scale(1); }
    82.14% { opacity: 1; filter: blur(0px); transform: translateY(0) scale(1); }
    84.52%, 100% { opacity: 0; filter: blur(10px); transform: translateY(-10px) scale(1.02); }
  }

  @keyframes s6BgLayer {
    0% { transform: scale(1.05); filter: blur(3px); }
    1.19% { transform: scale(1.1); filter: blur(6px); }
    84.52% { transform: scale(1.1); filter: blur(6px); }
    90% { transform: scale(1); filter: blur(0px); }
    98.81% { transform: scale(1); filter: blur(0px); }
    100% { transform: scale(1.05); filter: blur(3px); }
  }
  @keyframes s6LogoLayer {
    0% { transform: scale(1.03) translateY(0); filter: blur(4px); }
    1.19% { transform: scale(0.9) translateY(10px); filter: blur(10px); }
    84.52% { transform: scale(0.82) translateY(10px); filter: blur(10px); }
    90% { transform: scale(1.02) translateY(0); filter: blur(0px); }
    95% { transform: scale(1) translateY(0); filter: blur(0px); }
    98.81% { transform: scale(1) translateY(0); filter: blur(0px); }
    100% { transform: scale(1.03) translateY(0); filter: blur(4px); }
  }

  /* ---- Mobile-only adjustments (portrait phones) ---- */
  @media (max-width: 600px) {
    /* Scene 2: widen the photo collage so it fills the portrait frame instead of sitting small and letterboxed */
    .s2-photo { width: 96% !important; height: auto !important; }
    /* Scene 3: enlarge the rotating logo +10%, kept centered */
    .s3-logo-wrap { width: min(37.4vw,37.4vh) !important; }
    /* Scene 4: enlarge the gallery grid images +20% */
    .s4-grid { width: clamp(288px,45.6vw,648px) !important; }
  }
</style>
</head>
<body>

<div class="stage">

  <div class="scene" style="background:#08070a;animation-name:s1Window;" data-screen-label="Scene 1 — Logo intro">
    <img src="../../images/portfolio/artista-artista/reel/s1-bg.webp" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:s1BgReveal var(--d) linear infinite;transform-origin:center;" />
    <div style="position:absolute;inset:0;background:radial-gradient(ellipse at 50% 52%, transparent 30%, rgba(6,4,3,0.85) 100%);"></div>
    <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;">
      <img src="../../images/portfolio/artista-artista/reel/s1-logo.webp" alt="Artista Artista" style="height:min(30vh,26vw);width:auto;max-width:60vw;object-fit:contain;animation:s1LogoMorph var(--d) linear infinite;filter:drop-shadow(0 1.4vw 3.6vw rgba(0,0,0,0.55));" />
    </div>
  </div>

  <div class="scene" style="background:#0a0a0a;animation-name:s2Window;" data-screen-label="Scene 2 — Gallery photo">
    <img src="../../images/portfolio/artista-artista/reel/s2-bg.webp" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:s2BgBreathe 9s ease-in-out infinite;" />
    <img src="../../images/portfolio/artista-artista/reel/s2-photo.webp" alt="Gallery photo" class="s2-photo" style="position:absolute;inset:0;width:88%;height:88%;margin:auto;object-fit:contain;animation:s2PhotoMorph var(--d) linear infinite;" />
  </div>

  <div class="scene" style="background:#000;animation-name:s3Window;" data-screen-label="Scene 3 — Spinning logo">
    <img src="../../images/portfolio/artista-artista/reel/s3-bg.webp" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(6px);transform:scale(1.05);" />
    <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;">
      <div class="s3-logo-wrap" style="width:min(34vw,34vh);aspect-ratio:1;animation:s3LogoReveal var(--d) linear infinite;">
        <img src="../../images/portfolio/artista-artista/reel/s3-logo-round.webp" alt="Artista logo" style="width:140%;height:140%;display:block;border-radius:50%;animation:s3Spin 16s linear infinite;filter:drop-shadow(0 1.2vw 3.6vw rgba(0,0,0,0.55));" />
      </div>
    </div>
  </div>

  <div class="scene" style="background:#0a0906;animation-name:s4Window;" data-screen-label="Scene 4 — Gallery grid">
    <img src="../../images/portfolio/artista-artista/reel/s4-bg.webp" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;" />
    <div class="s4-grid" style="position:absolute;top:50%;right:6%;transform:translateY(-50%);width:clamp(240px,38vw,540px);aspect-ratio:1176/1544;display:grid;grid-template-columns:639fr 501fr;grid-template-rows:751fr 757fr;">
      <img src="../../images/portfolio/artista-artista/reel/s4-gallery-1.webp" alt="" style="width:100%;height:100%;object-fit:cover;grid-column:1;grid-row:1;animation:s4Photo1 var(--d) linear infinite;" />
      <img src="../../images/portfolio/artista-artista/reel/s4-gallery-2.webp" alt="" style="width:100%;height:100%;object-fit:cover;grid-column:2;grid-row:1;animation:s4Photo2 var(--d) linear infinite;" />
      <img src="../../images/portfolio/artista-artista/reel/s4-gallery-3.webp" alt="" style="width:100%;height:100%;object-fit:cover;grid-column:1;grid-row:2;animation:s4Photo3 var(--d) linear infinite;" />
      <img src="../../images/portfolio/artista-artista/reel/s4-gallery-4.webp" alt="" style="width:100%;height:100%;object-fit:cover;grid-column:2;grid-row:2;animation:s4Photo4 var(--d) linear infinite;" />
    </div>
  </div>

  <div class="scene" style="background:#0a0a0a;animation-name:s5Window;" data-screen-label="Scene 5 — Quote">
    <img src="../../images/portfolio/artista-artista/reel/s5-bg.webp" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:s5BgFadeIn var(--d) linear infinite;" />
    <div style="position:absolute;inset:0;background:linear-gradient(180deg, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.35) 55%, rgba(0,0,0,0.55) 100%);"></div>
    <div class="hide-in-tile" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:0 8vw;">
      <p style="margin:0;max-width:52ch;color:#f2f0ea;font-size:clamp(1rem,2vw,1.7rem);font-weight:300;line-height:1.5;text-align:center;letter-spacing:0.01em;animation:s5TextMorph var(--d) linear infinite;text-shadow:0 2px 24px rgba(0,0,0,0.45);">Artista Artista brings together photographers, visual artists, and creatives worldwide— forging a global art movement with real purpose.</p>
    </div>
  </div>

  <div class="scene" style="background:#08070a;animation-name:s6Window;" data-screen-label="Scene 6 — Outro">
    <img src="../../images/portfolio/artista-artista/reel/s6-bg.webp" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:s6BgLayer var(--d) linear infinite;" />
    <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;">
      <img src="../../images/portfolio/artista-artista/reel/s6-logo-text.webp" alt="Artista" style="width:min(56vw,880px);max-width:90%;height:auto;animation:s6LogoLayer var(--d) linear infinite;" />
    </div>
  </div>

  <div style="position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.32) 100%);"></div>

</div>

</body>
</html>
