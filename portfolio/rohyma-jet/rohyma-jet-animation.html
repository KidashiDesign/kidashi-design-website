<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rohyma Jet — Animation Sequence</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #0a0705; overflow: hidden; }

  .stage { position: relative; width: 100%; height: 100%; overflow: hidden; background: #0a0705; }
  .paused .scene, .paused .scene * { animation-play-state: paused !important; }

  .scene { position: absolute; inset: 0; }
  .scene__frame { position: absolute; inset: 0; overflow: hidden; }
  .scene__frame img { will-change: transform, opacity, filter; }

  /* ---------- visibility (hard-cut) keyframes, 88s master clock ---------- */
  @keyframes visS1 {
    0%     { opacity: 0.5; }
    1.2%   { opacity: 1; }
    12.44% { opacity: 1; }
    14.84% { opacity: 0; }
    98.8%  { opacity: 0; }
    100%   { opacity: 0.5; }
  }
  @keyframes visS2 {
    0%     { opacity: 0; }
    12.44% { opacity: 0; }
    14.84% { opacity: 1; }
    27.21% { opacity: 1; }
    29.61% { opacity: 0; }
    100%   { opacity: 0; }
  }
  @keyframes visS3 {
    0%     { opacity: 0; }
    27.21% { opacity: 0; }
    29.61% { opacity: 1; }
    38.57% { opacity: 1; }
    40.97% { opacity: 0; }
    100%   { opacity: 0; }
  }
  @keyframes visS4 {
    0%     { opacity: 0; }
    38.57% { opacity: 0; }
    40.97% { opacity: 1; }
    53.35% { opacity: 1; }
    55.75% { opacity: 0; }
    100%   { opacity: 0; }
  }
  @keyframes visS5 {
    0%     { opacity: 0; }
    53.35% { opacity: 0; }
    55.75% { opacity: 1; }
    64.71% { opacity: 1; }
    67.11% { opacity: 0; }
    100%   { opacity: 0; }
  }
  @keyframes visS6 {
    0%     { opacity: 0; }
    64.71% { opacity: 0; }
    67.11% { opacity: 1; }
    84.03% { opacity: 1; }
    86.43% { opacity: 0; }
    100%   { opacity: 0; }
  }
  @keyframes visS7 {
    0%     { opacity: 0.5; }
    1.2%   { opacity: 0; }
    84.03% { opacity: 0; }
    86.43% { opacity: 1; }
    98.8%  { opacity: 1; }
    100%   { opacity: 0.5; }
  }

  /* ---------- s1: morphing logo intro (0.00%–13.64%) ---------- */
  @keyframes s1KenBurns {
    0%    { transform: scale(1) translate(0,0); }
    13.64%{ transform: scale(1.12) translate(-1.5%,-1%); }
    100%  { transform: scale(1.12) translate(-1.5%,-1%); }
  }
  @keyframes s1LogoBuild {
    0%     { opacity: 0; transform: scale(0.55) translateY(clamp(4px,0.8vh,8px)); filter: blur(18px); }
    3.41%  { opacity: 1; transform: scale(1) translateY(0); filter: blur(0px); }
    9.55%  { opacity: 1; transform: scale(1) translateY(0); filter: blur(0px); }
    11.59% { opacity: 0; transform: scale(1.06) translateY(clamp(-4px,-0.5vh,-2px)); filter: blur(8px); }
    13.64% { opacity: 0; transform: scale(0.55) translateY(clamp(4px,0.8vh,8px)); filter: blur(18px); }
    100%   { opacity: 0; transform: scale(0.55) translateY(clamp(4px,0.8vh,8px)); filter: blur(18px); }
  }

  /* ---------- s2: colour palette zoom (13.64%–28.41%) ---------- */
  @keyframes s2BgZoom {
    13.64% { transform: scale(1); }
    21.02% { transform: scale(1.14); }
    28.41% { transform: scale(1); }
    100%   { transform: scale(1); }
  }
  @keyframes s2BgDim {
    13.64% { filter: brightness(1) saturate(1); }
    20.28% { filter: brightness(1) saturate(1); }
    22.50% { filter: brightness(0.55) saturate(0.85); }
    26.64% { filter: brightness(0.55) saturate(0.85); }
    28.41% { filter: brightness(1) saturate(1); }
    100%   { filter: brightness(1) saturate(1); }
  }
  @keyframes s2PaletteMorph {
    13.64% { opacity: 0; transform: scale(0.82); filter: blur(28px); }
    21.61% { opacity: 0; transform: scale(0.82); filter: blur(28px); }
    24.72% { opacity: 1; transform: scale(1); filter: blur(0px); }
    26.93% { opacity: 1; transform: scale(1); filter: blur(0px); }
    28.41% { opacity: 0; transform: scale(0.92); filter: blur(14px); }
    100%   { opacity: 0; transform: scale(0.82); filter: blur(28px); }
  }
  @keyframes s2GlowPulse {
    13.64% { opacity: 0; }
    21.61% { opacity: 0; }
    24.72% { opacity: 0.9; }
    26.93% { opacity: 0.9; }
    28.41% { opacity: 0; }
    100%   { opacity: 0; }
  }

  /* ---------- s3: logo invert (28.41%–39.77%) ---------- */
  @keyframes s3RjLoop {
    28.41% { opacity: 0; filter: blur(14px); transform: scale(1.12); }
    30.91% { opacity: 1; filter: blur(0px); transform: scale(1); }
    37.27% { opacity: 1; filter: blur(0px); transform: scale(1); }
    39.77% { opacity: 0; filter: blur(14px); transform: scale(1.06); }
    100%   { opacity: 0; filter: blur(14px); transform: scale(1.12); }
  }

  /* ---------- s4: airplane fly-by (39.77%–54.55%) ---------- */
  @keyframes s4BgZoom {
    39.77% { transform: scale(1); }
    54.55% { transform: scale(1.15); }
    100%   { transform: scale(1.15); }
  }
  @keyframes s4PlaneFlyPos {
    39.77% { transform: translate3d(90vw,-95vh,0) scale(0.7); }
    43.91% { transform: translate3d(55vw,-75vh,0) scale(0.92); }
    50.41% { transform: translate3d(-95vw,-10vh,0) scale(1); }
    54.55% { transform: translate3d(-160vw,5vh,0) scale(1.1); }
    100%   { transform: translate3d(-160vw,5vh,0) scale(1.1); }
  }
  @keyframes s4PlaneFlyFx {
    39.77% { opacity: 0; filter: blur(18px); }
    43.02% { opacity: 1; filter: blur(0px); }
    52.77% { opacity: 1; filter: blur(0px); }
    54.55% { opacity: 0; filter: blur(14px); }
    100%   { opacity: 0; filter: blur(14px); }
  }

  /* ---------- s5: font hero (54.55%–65.91%) ---------- */
  @keyframes s5RjBuild {
    54.55% { opacity: 0; filter: blur(26px); transform: scale(1.08); }
    57.05% { opacity: 1; filter: blur(0px); transform: scale(1); }
    63.41% { opacity: 1; filter: blur(0px); transform: scale(1); }
    65.91% { opacity: 0; filter: blur(26px); transform: scale(1.08); }
    100%   { opacity: 0; filter: blur(26px); transform: scale(1.08); }
  }

  /* ---------- s6: fullscreen hero (65.91%–85.23%) ---------- */
  @keyframes s6MorphIn {
    65.91% { opacity: 0; filter: blur(24px) saturate(0.8); transform: scale(1.18); }
    68.81% { opacity: 1; filter: blur(0px) saturate(1); transform: scale(1.06); }
    100%   { opacity: 1; filter: blur(0px) saturate(1); transform: scale(1.06); }
  }
  @keyframes s6KenBurns {
    68.81% { transform: scale(1.06) translate(0,0); }
    77.02% { transform: scale(1.14) translate(-1.2%,1%); }
    85.23% { transform: scale(1.06) translate(0,0); }
    100%   { transform: scale(1.06) translate(0,0); }
  }

  /* ---------- s7: logo colour outro (85.23%–100%) ---------- */
  @keyframes s7BgBuild {
    85.23% { opacity: 0; transform: scale(1.12); filter: blur(6px); }
    89.66% { opacity: 1; filter: blur(0px); }
    97.78% { opacity: 1; transform: scale(1); }
    100%   { opacity: 1; transform: scale(1.04); }
  }
  @keyframes s7LogoMorph {
    85.23% { opacity: 0; transform: scale(0.7) rotate(-4deg); filter: blur(10px); border-radius: 40%; }
    87.44% { opacity: 1; transform: scale(1) rotate(0deg); filter: blur(0px); border-radius: 0%; }
    95.57% { opacity: 1; transform: scale(1) rotate(0deg); filter: blur(0px); border-radius: 0%; }
    100%   { opacity: 0; transform: scale(1.25) rotate(3deg); filter: blur(10px); border-radius: 40%; }
  }

  /* ── Reduced motion: hold a single, calm frame ── */
  @media (prefers-reduced-motion: reduce) {
    .scene, .scene * { animation: none !important; }
    .scene { opacity: 0; }
    .scene--s1 { opacity: 1; }
    .scene--s1 img[data-role="logo"] { opacity: 1; transform: none; filter: none; }
  }

  /* ── Mobile: enlarge logos (s1/s3/s7), colour palette (s2) and plane (s4) ── */
  @media (max-width: 600px) {
    .anim-mobile-s1-logo { width: clamp(280px, 54vw, 420px) !important; }
    .anim-mobile-s2-colors { width: clamp(340px, 88vw, 920px) !important; }
    .anim-mobile-s3-logo { width: clamp(300px, 100vw, 1200px) !important; }
    .anim-mobile-s4-plane { width: clamp(300px, 85vw, 900px) !important; }
    .anim-mobile-s7-logo { width: clamp(260px, 60vw, 420px) !important; }
  }
</style>
</head>
<body>
<div class="stage" id="stage">

  <!-- s1 : morphing logo intro -->
  <div class="scene scene--s1" style="animation: visS1 88s linear infinite;">
    <div class="scene__frame" style="background:#0a0705;">
      <img src="../../images/portfolio/rohyma-jet/anim-01-cabin-bg.webp" alt="Rohyma Jet private cabin interior" style="position:absolute; top:-6%; left:-6%; width:112%; height:112%; object-fit:cover; animation: s1KenBurns 88s linear infinite;" />
      <div style="position:absolute; inset:0; background:radial-gradient(ellipse at center, rgba(10,7,5,0.15) 0%, rgba(10,7,5,0.55) 75%, rgba(10,7,5,0.75) 100%);"></div>
      <div style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding:6vw;">
        <img data-role="logo" class="anim-mobile-s1-logo" src="../../images/portfolio/rohyma-jet/anim-01-cabin-logo.webp" alt="Rohyma Jet logo" style="width:clamp(240px, 42vw, 420px); max-width:90%; height:auto; animation: s1LogoBuild 88s linear infinite;" />
      </div>
    </div>
  </div>

  <!-- s2 : colour palette zoom -->
  <div class="scene" style="animation: visS2 88s linear infinite;">
    <div class="scene__frame" style="background:#000;">
      <img src="../../images/portfolio/rohyma-jet/anim-02-palette-bg.webp" alt="" style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transform-origin:center 60%; animation: s2BgZoom 88s linear infinite, s2BgDim 88s linear infinite;" />
      <div style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none;">
        <div class="anim-mobile-s2-colors" style="position:relative; width:clamp(320px, 72vw, 920px); aspect-ratio:1019/566;">
          <div style="position:absolute; inset:-10%; background:radial-gradient(closest-side, rgba(255,255,255,0.55), rgba(255,255,255,0)); filter:blur(clamp(20px,3vw,40px)); animation: s2GlowPulse 88s linear infinite;"></div>
          <img src="../../images/portfolio/rohyma-jet/anim-02-palette-swatch.webp" alt="Rohyma Jet brand colour palette" style="position:absolute; width:100%; height:100%; object-fit:contain; animation: s2PaletteMorph 88s linear infinite; filter:drop-shadow(0 20px 60px rgba(0,0,0,0.35));" />
        </div>
      </div>
    </div>
  </div>

  <!-- s3 : logo invert -->
  <div class="scene" style="animation: visS3 88s linear infinite;">
    <div class="scene__frame" style="background:#000; display:flex; align-items:center; justify-content:center;">
      <img class="anim-mobile-s3-logo" src="../../images/portfolio/rohyma-jet/anim-03-logo-invert.webp" alt="Rohyma Jet — Enjoy exclusive travel and private jet experiences" style="width:clamp(280px, 92vw, 1200px); height:auto; animation: s3RjLoop 88s linear infinite;" />
    </div>
  </div>

  <!-- s4 : airplane fly-by -->
  <div class="scene" style="animation: visS4 88s linear infinite;">
    <div class="scene__frame" style="background:#0b1620;">
      <img src="../../images/portfolio/rohyma-jet/anim-04-sky-bg.webp" alt="" style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transform-origin:50% 40%; animation: s4BgZoom 88s linear infinite;" />
      <img class="anim-mobile-s4-plane" src="../../images/portfolio/rohyma-jet/anim-04-plane.png" alt="" style="position:absolute; top:50%; left:50%; width:clamp(260px, 70vw, 900px); filter:drop-shadow(0 20px 40px rgba(0,0,0,0.35)); transform:translate(-50%,-50%); animation: s4PlaneFlyPos 88s linear infinite, s4PlaneFlyFx 88s linear infinite;" />
    </div>
  </div>

  <!-- s5 : font hero -->
  <div class="scene" style="animation: visS5 88s linear infinite;">
    <div class="scene__frame" style="background:#0a0a0a;">
      <img src="../../images/portfolio/rohyma-jet/anim-05-font-hero.webp" alt="Rohyma Jet brand typography" style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover; animation: s5RjBuild 88s linear infinite;" />
    </div>
  </div>

  <!-- s6 : fullscreen hero -->
  <div class="scene" style="animation: visS6 88s linear infinite;">
    <div class="scene__frame" style="background:#0a0a0a;">
      <img src="../../images/portfolio/rohyma-jet/anim-06-luggage-hero.webp" alt="Rohyma Jet branded luggage" style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover; animation: s6MorphIn 88s linear infinite, s6KenBurns 88s linear infinite;" />
    </div>
  </div>

  <!-- s7 : logo colour outro -->
  <div class="scene" style="animation: visS7 88s linear infinite;">
    <div class="scene__frame" style="background:#0c0f0e;">
      <img src="../../images/portfolio/rohyma-jet/anim-07-outro-bg.webp" alt="" style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover; animation: s7BgBuild 88s linear infinite;" />
      <div style="position:absolute; inset:0; background:radial-gradient(circle at center, rgba(0,0,0,0) 0%, rgba(0,0,0,0.25) 100%);"></div>
      <div style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center;">
        <img class="anim-mobile-s7-logo" src="../../images/portfolio/rohyma-jet/anim-07-outro-logo.webp" alt="Rohyma Jet" style="width:clamp(220px, 48vw, 420px); height:auto; filter:drop-shadow(0 6px 24px rgba(0,0,0,0.35)); animation: s7LogoMorph 88s linear infinite;" />
      </div>
    </div>
  </div>

</div>

<script>
(function () {
  "use strict";
  // Pause the whole reel (all layers stay in sync since they share one clock)
  // whenever the tab/iframe isn't visible — saves battery/CPU on portfolio pages
  // that run several tile animations at once.
  var stage = document.getElementById('stage');
  document.addEventListener('visibilitychange', function () {
    stage.classList.toggle('paused', document.hidden);
  });
})();
</script>
</body>
</html>
