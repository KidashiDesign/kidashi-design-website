<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galerie Kronsbein Animation</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#14160f;overflow:hidden}
.scene{position:relative;width:100vw;height:100vh;height:100svh;overflow:hidden;background:#14160f;--move-scale:1.4}

@keyframes bgFadeIn{0%{opacity:0}100%{opacity:1}}
@keyframes bgZoomLoop{
  0%{transform:scale(1) translate(0,0)}
  100%{transform:scale(1.1) translate(calc(var(--move-scale,1) * -1.5%),calc(var(--move-scale,1) * 1%))}
}
@keyframes blobMoveA{
  0%{transform:translate(-8%,-6%) scale(1);opacity:.45}
  100%{transform:translate(6%,8%) scale(1.25);opacity:.65}
}
@keyframes blobMoveB{
  0%{transform:translate(6%,8%) scale(1.15);opacity:.55}
  100%{transform:translate(-10%,-4%) scale(1);opacity:.4}
}
@keyframes buildIn{
  0%{opacity:0;transform:translateY(60px) scale(.88)}
  100%{opacity:1;transform:translateY(0) scale(1)}
}
@keyframes floatBob{
  0%{transform:translate(0,0)}
  100%{transform:translate(calc(var(--move-scale,1) * -12px),calc(var(--move-scale,1) * 18px))}
}
@keyframes floatBobA{
  0%{transform:translate(0,0)}
  100%{transform:translate(calc(var(--move-scale,1) * 10px),calc(var(--move-scale,1) * -30px))}
}
@keyframes floatBobB{
  0%{transform:translate(0,0)}
  100%{transform:translate(calc(var(--move-scale,1) * -16px),calc(var(--move-scale,1) * 22px))}
}
@keyframes floatBobC{
  0%{transform:translate(0,0)}
  100%{transform:translate(calc(var(--move-scale,1) * 14px),calc(var(--move-scale,1) * 26px))}
}
@keyframes seqHome{0%{opacity:0;transform:translateY(0)}2%{opacity:1}14%{opacity:1;transform:translateY(-68.8%)}16%{opacity:0}100%{opacity:0;transform:translateY(-68.8%)}}
@keyframes seqGallery{0%{opacity:0;transform:translateY(0)}2%{opacity:1}14%{opacity:1;transform:translateY(-55.4%)}16%{opacity:0}100%{opacity:0;transform:translateY(-55.4%)}}
@keyframes seqExhibition{0%{opacity:0;transform:translateY(0)}2%{opacity:1}14%{opacity:1;transform:translateY(-55.9%)}16%{opacity:0}100%{opacity:0;transform:translateY(-55.9%)}}
@keyframes seqInterior{0%{opacity:0;transform:translateY(0)}2%{opacity:1}14%{opacity:1;transform:translateY(-77%)}16%{opacity:0}100%{opacity:0;transform:translateY(-77%)}}
@keyframes seqPresse{0%{opacity:0;transform:translateY(0)}2%{opacity:1}14%{opacity:1;transform:translateY(-81.8%)}16%{opacity:0}100%{opacity:0;transform:translateY(-81.8%)}}
@keyframes seqExhibition2{0%{opacity:0;transform:translateY(0)}2%{opacity:1}14%{opacity:1;transform:translateY(-89.3%)}16%{opacity:0}100%{opacity:0;transform:translateY(-89.3%)}}

.bg{position:absolute;inset:0;animation:bgFadeIn 2.4s ease-out both}
.bg__zoom{position:absolute;inset:-6%;animation:bgZoomLoop 26s ease-in-out infinite alternate}
.bg__zoom img{width:100%;height:100%;object-fit:cover;display:block}
.bg__tint{position:absolute;inset:0;background:linear-gradient(160deg,rgba(27,30,22,.65),rgba(113,128,95,.22) 55%,rgba(27,30,22,.5))}
.bg__blob-a{position:absolute;inset:-20%;border-radius:50%;background:radial-gradient(circle,#71805f 0%,rgba(113,128,95,0) 62%);mix-blend-mode:screen;animation:blobMoveA 22s ease-in-out infinite alternate}
.bg__blob-b{position:absolute;inset:-25%;border-radius:50%;background:radial-gradient(circle,#1b1e16 0%,rgba(27,30,22,0) 65%);mix-blend-mode:multiply;animation:blobMoveB 28s ease-in-out infinite alternate}
.bg__vignette{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 38%,rgba(11,12,8,.6) 100%)}

.card{position:absolute;z-index:2}
.card img{display:block;filter:blur(.5px) drop-shadow(0 24px 44px rgba(0,0,0,.5))}
.card--warhol{left:6%;top:8%}
.card--warhol .card__build{animation:buildIn 1.3s ease-out .1s both}
.card--warhol .card__bob{animation:floatBobA 19s ease-in-out -3s infinite alternate}
.card--warhol img{width:clamp(70px,20vw,210px);transform:rotate(6deg)}
.card--stik{right:5%;top:10%}
.card--stik .card__build{animation:buildIn 1.3s ease-out .3s both}
.card--stik .card__bob{animation:floatBobB 24s ease-in-out -9s infinite alternate}
.card--stik img{width:clamp(60px,17vw,180px);transform:rotate(-5deg)}
.card--russell{left:8%;top:66%}
.card--russell .card__build{animation:buildIn 1.3s ease-out .5s both}
.card--russell .card__bob{animation:floatBobC 16s ease-in-out -6s infinite alternate}
.card--russell img{width:clamp(55px,16vw,170px);transform:rotate(4deg)}

.frame-wrap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:6}
.frame-wrap__build{animation:buildIn 1.4s ease-out .2s both}
.frame-wrap__bob{animation:floatBob 18s ease-in-out -5s infinite alternate}
.frame{width:clamp(240px,64vw,1200px);aspect-ratio:100/63;border-radius:clamp(10px,.7vw,16px);overflow:hidden;box-shadow:0 40px 90px rgba(0,0,0,.55),0 12px 28px rgba(0,0,0,.4);background:#efece4;display:flex;flex-direction:column}
.frame__chrome{height:clamp(18px,1.2vw,26px);display:flex;align-items:center;gap:6px;padding:0 12px;background:#efece4;flex-shrink:0}
.frame__dot{width:7px;height:7px;border-radius:50%;background:rgba(27,30,22,.28)}
.frame__viewport{position:relative;overflow:hidden;width:100%;flex:1}
.frame__viewport img{position:absolute;top:0;left:0;width:100%;height:auto;display:block}
.frame__viewport img.s-home{animation:seqHome 60s ease-in-out infinite;animation-delay:0s}
.frame__viewport img.s-gallery{animation:seqGallery 60s ease-in-out infinite;animation-delay:-10s}
.frame__viewport img.s-exhibition{animation:seqExhibition 60s ease-in-out infinite;animation-delay:-20s}
.frame__viewport img.s-interior{animation:seqInterior 60s ease-in-out infinite;animation-delay:-30s}
.frame__viewport img.s-presse{animation:seqPresse 60s ease-in-out infinite;animation-delay:-40s}
.frame__viewport img.s-exhibition2{animation:seqExhibition2 60s ease-in-out infinite;animation-delay:-50s}
</style>
</head>
<body>
<div class="scene">

  <div class="bg">
    <div class="bg__zoom"><img src="assets/background.webp" alt=""></div>
    <div class="bg__tint"></div>
    <div class="bg__blob-a"></div>
    <div class="bg__blob-b"></div>
    <div class="bg__vignette"></div>
  </div>

  <div class="card card--warhol">
    <div class="card__build"><div class="card__bob"><img src="assets/card-warhol.webp" alt=""></div></div>
  </div>

  <div class="card card--stik">
    <div class="card__build"><div class="card__bob"><img src="assets/card-stik.webp" alt=""></div></div>
  </div>

  <div class="card card--russell">
    <div class="card__build"><div class="card__bob"><img src="assets/card-russell.webp" alt=""></div></div>
  </div>

  <div class="frame-wrap">
    <div class="frame-wrap__build">
      <div class="frame-wrap__bob">
        <div class="frame">
          <div class="frame__chrome">
            <div class="frame__dot"></div>
            <div class="frame__dot"></div>
            <div class="frame__dot"></div>
          </div>
          <div class="frame__viewport">
            <img src="assets/shot-home-detail.webp" alt="" class="s-home">
            <img src="assets/shot-gallery-view.webp" alt="" class="s-gallery">
            <img src="assets/shot-exhibition-detail.webp" alt="" class="s-exhibition">
            <img src="assets/shot-interior.webp" alt="" class="s-interior">
            <img src="assets/shot-presse.webp" alt="" class="s-presse">
            <img src="assets/shot-exhibition-detail-2.webp" alt="" class="s-exhibition2">
          </div>
        </div>
      </div>
    </div>
  </div>

</div>
</body>
</html>
