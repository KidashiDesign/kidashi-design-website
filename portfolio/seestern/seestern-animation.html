<!DOCTYPE html>
<html lang="en">
<head>
<script>
(function(){
  if(!location.search.includes('tile'))return;
  var css='text,tspan{display:none!important}[class*="text"],[class*="Text"],[class*="title"],[class*="Title"],[class*="label"],[class*="Label"],[class*="caption"],[class*="Caption"],[class*="heading"],[class*="Heading"]{visibility:hidden!important}';
  function inject(){var s=document.createElement('style');s.textContent=css;(document.head||document.documentElement).appendChild(s);}
  inject();document.addEventListener('DOMContentLoaded',inject);setTimeout(inject,500);setTimeout(inject,1500);
})();
</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seestern Britzer Garten — Showreel</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#f5efe4; }

  @keyframes scene0Anim {
    0%   { opacity: 0.5; filter: blur(16px); transform: scale(1.08); }
    4%   { opacity: 1;   filter: blur(0px);  transform: scale(1); }
    14%  { opacity: 1;   filter: blur(0px);  transform: scale(1.02); }
    22%  { opacity: 0;   filter: blur(16px); transform: scale(1.08); }
    96%  { opacity: 0;   filter: blur(16px); transform: scale(1.08); }
    100% { opacity: 0.5; filter: blur(16px); transform: scale(1.08); }
  }
  @keyframes scene1Envelope {
    0% { opacity: 0; } 14% { opacity: 0; } 22% { opacity: 1; }
    43% { opacity: 1; } 51% { opacity: 0; } 100% { opacity: 0; }
  }
  @keyframes blobMorph0 {
    0%, 100% { transform: translate(-6%,-4%) scale(1); border-radius: 42% 58% 63% 37% / 41% 44% 56% 59%; }
    50% { transform: translate(8%,10%) scale(1.15); border-radius: 63% 37% 41% 59% / 51% 62% 38% 49%; }
  }
  @keyframes blobMorph1 {
    0%, 100% { transform: translate(4%,6%) scale(1.05); border-radius: 50% 50% 33% 67% / 60% 40% 60% 40%; }
    50% { transform: translate(-8%,-6%) scale(0.92); border-radius: 37% 63% 56% 44% / 49% 51% 49% 51%; }
  }
  @keyframes blobMorph2 {
    0%, 100% { transform: translate(-5%,8%) scale(0.95); border-radius: 55% 45% 40% 60% / 45% 55% 45% 55%; }
    50% { transform: translate(7%,-9%) scale(1.1); border-radius: 40% 60% 60% 40% / 60% 35% 65% 40%; }
  }
  @keyframes blobMorph3 {
    0%, 100% { transform: translate(6%,-8%) scale(1.08); border-radius: 60% 40% 50% 50% / 40% 60% 40% 60%; }
    50% { transform: translate(-6%,7%) scale(0.94); border-radius: 45% 55% 65% 35% / 55% 45% 55% 45%; }
  }
  @keyframes blobMorph4 {
    0%, 100% { transform: translate(-7%,-6%) scale(1); border-radius: 48% 52% 55% 45% / 50% 50% 50% 50%; }
    50% { transform: translate(9%,5%) scale(1.12); border-radius: 58% 42% 38% 62% / 42% 58% 42% 58%; }
  }
  @keyframes imgBreathe {
    0%, 100% { transform: scale(1); filter: blur(0px); }
    50% { transform: scale(1.04); filter: blur(2px); }
  }
  @keyframes scene2Envelope {
    0%  { opacity: 0; filter: blur(18px); transform: scale(0.9); }
    43% { opacity: 0; filter: blur(18px); transform: scale(0.9); }
    51% { opacity: 1; filter: blur(0px);  transform: scale(1); }
    63% { opacity: 1; filter: blur(0px);  transform: scale(1); }
    71% { opacity: 0; filter: blur(14px); transform: scale(1.08); }
    100% { opacity: 0; filter: blur(14px); transform: scale(1.08); }
  }
  @keyframes spinCW { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @keyframes spinCCW { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }
  @keyframes scene3Envelope {
    0% { opacity: 0; } 63% { opacity: 0; } 71% { opacity: 1; }
    78% { opacity: 1; } 86% { opacity: 0; } 100% { opacity: 0; }
  }
  @keyframes cardZoom {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.06); }
  }
  @keyframes scene4Envelope {
    0%  { opacity: 0.5; filter: blur(20px); transform: scale(1.06); }
    4%  { opacity: 0;   filter: blur(24px); transform: scale(1.1); }
    78% { opacity: 0;   filter: blur(24px); transform: scale(1.1); }
    86% { opacity: 1;   filter: blur(0px);  transform: scale(1); }
    96% { opacity: 1;   filter: blur(0px);  transform: scale(1); }
    100% { opacity: 0.5; filter: blur(20px); transform: scale(1.06); }
  }

  @media (prefers-reduced-motion: reduce) {
    .stage * { animation: none !important; }
  }
</style>
</head>
<body>
<div id="stage" style="position: fixed; inset: 0; width: 100vw; height: 100vh; overflow: hidden; background: #f5efe4;" class="stage">
  <div style="position: absolute; inset: 0; z-index: 1;">
    <img
      src="../../images/portfolio/seestern/scene1-intro.webp"
      alt="Seestern Britzer Garten – Brautpaar"
      style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center; animation: scene0Anim 48s cubic-bezier(.22,.8,.25,1) infinite;"
    />
  </div>

  <div style="position: absolute; inset: 0; z-index: 2; overflow: hidden; animation: scene1Envelope 48s ease-in-out infinite;">
    <div style="position: absolute; left: -15%; top: -20%; width: 75vmax; height: 75vmax; background: radial-gradient(circle, #eadeca 0%, rgba(234,222,202,0) 70%); animation: blobMorph0 20.80s ease-in-out infinite;"></div>
    <div style="position: absolute; left: 8%; top: -25%; width: 70vmax; height: 70vmax; background: radial-gradient(circle, #c2dcd1 0%, rgba(194,220,209,0) 70%); animation: blobMorph1 24.00s ease-in-out infinite;"></div>
    <div style="position: absolute; left: 33%; top: 8%; width: 82vmax; height: 82vmax; background: radial-gradient(circle, #aac9c3 0%, rgba(170,201,195,0) 70%); animation: blobMorph2 27.20s ease-in-out infinite;"></div>
    <div style="position: absolute; left: 52%; top: -12%; width: 76vmax; height: 76vmax; background: radial-gradient(circle, #de7749 0%, rgba(222,119,73,0) 70%); animation: blobMorph3 22.40s ease-in-out infinite;"></div>
    <div style="position: absolute; left: 66%; top: 18%; width: 80vmax; height: 80vmax; background: radial-gradient(circle, #f4a34c 0%, rgba(244,163,76,0) 70%); animation: blobMorph4 25.60s ease-in-out infinite;"></div>
    <img
      src="../../images/portfolio/seestern/scene2-colorfade.webp"
      alt="Seestern Farbwelt"
      style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.85; animation: imgBreathe 19.20s ease-in-out infinite;"
    />
  </div>

  <div style="position: absolute; inset: 0; z-index: 3; overflow: hidden; animation: scene2Envelope 48s cubic-bezier(.22,.8,.25,1) infinite;">
    <img src="../../images/portfolio/seestern/scene3-badge-bg.webp" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center;" />
    <div style="position: absolute; top: 50%; left: 50%; --outer: calc(max(31.6vw,56.1vh) * 1.32); width: var(--outer); height: var(--outer); margin-top: calc(var(--outer) / -2); margin-left: calc(var(--outer) / -2); animation: spinCCW 48s linear infinite;">
      <img src="../../images/portfolio/seestern/scene3-ring-outer.webp" alt="" style="width: 100%; height: 100%; object-fit: contain; pointer-events: none;" />
    </div>
    <div style="position: absolute; top: 50%; left: 50%; --inner: calc(max(31.6vw,56.1vh) * 0.92); width: var(--inner); height: var(--inner); margin-top: calc(var(--inner) / -2 - 0.75vh); margin-left: calc(var(--inner) / -2); animation: spinCW 48s linear infinite;">
      <img src="../../images/portfolio/seestern/scene3-ring-inner.webp" alt="" style="width: 100%; height: 100%; object-fit: contain; pointer-events: none;" />
    </div>
  </div>

  <div style="position: absolute; inset: 0; z-index: 4; overflow: hidden; animation: scene3Envelope 48s ease-in-out infinite;">
    <img
      src="../../images/portfolio/seestern/scene4-card.webp"
      alt="Seestern Britzer Garten – Visitenkarten"
      style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; animation: cardZoom 8.00s cubic-bezier(.45,0,.2,1) infinite;"
    />
  </div>

  <div style="position: absolute; inset: 0; z-index: 5; background: #dd7846; display: flex; align-items: center; justify-content: center; overflow: hidden; animation: scene4Envelope 48s ease-in-out infinite;">
    <img src="../../images/portfolio/seestern/scene5-logo.webp" alt="Seestern Britzer Garten Logo" style="width: 100%; height: 100%; object-fit: contain;" />
  </div>
</div>

<script>
(function () {
  "use strict";
  var stage = document.getElementById('stage');
  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduced) return;

  function pause() { stage.querySelectorAll('*').forEach(function (el) { el.style.animationPlayState = 'paused'; }); }
  function play() { stage.querySelectorAll('*').forEach(function (el) { el.style.animationPlayState = 'running'; }); }

  stage.addEventListener('mouseenter', pause);
  stage.addEventListener('mouseleave', play);

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) pause(); else play();
  });
})();
</script>
</body>
</html>
