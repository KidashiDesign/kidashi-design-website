<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Art Gerecht Modular — Hero Animation</title>
<link rel="stylesheet" href="artgerecht-animation.css">
</head>
<body>
  <div class="stage" id="stage">

    <!-- 1. Intro logo -->
    <div class="scene" id="scene-intro">
      <div class="scene__wrapper bg-intro">
        <img class="scene__img" id="intro-bg" src="media/AGM_1.webp">
        <div id="intro-vig"></div>
        <div class="scene__center">
          <div id="intro-logo-clip">
            <img id="intro-logo" src="media/AGM_1.2.webp" alt="Art Gerecht Modular">
          </div>
        </div>
      </div>
      <div class="scene__overlay" id="intro-overlay"></div>
    </div>

    <!-- 2. Tech graphic grid -->
    <div class="scene" id="scene-techgrid">
      <div class="scene__wrapper bg-techgrid">
        <img class="scene__img" src="media/AGM_2.webp">
        <div id="techgrid-lines"></div>
        <div class="scene__center">
          <img id="techgrid-logo" src="media/AGM_2.2.webp" alt="Modular logo">
        </div>
      </div>
      <div class="scene__overlay" id="techgrid-overlay"></div>
    </div>

    <!-- 3. Truck outside view -->
    <div class="scene" id="scene-truck">
      <div class="scene__wrapper bg-truck">
        <svg class="hidden-svg">
          <defs>
            <filter id="truckMorphFilter" x="-20%" y="-20%" width="140%" height="140%">
              <feTurbulence id="truck-turb" type="fractalNoise" baseFrequency="0.008 0.011" numOctaves="2" seed="7" result="noise"></feTurbulence>
              <feDisplacementMap id="truck-disp" in="SourceGraphic" in2="noise" scale="0" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap>
            </filter>
          </defs>
        </svg>
        <img class="scene__img" id="truck-img" src="media/AGM_3.webp" alt="Overlanding expedition truck collage">
      </div>
      <div class="scene__overlay" id="truck-overlay"></div>
    </div>

    <!-- 4. Grid logo build -->
    <div class="scene" id="scene-gridlogo">
      <div class="scene__wrapper bg-gridlogo">
        <div class="scene__grid" id="gridlogo-grid">
          <div id="gridlogo-logo-wrap">
            <img src="media/AGM_4.3.webp" alt="Art Gerecht Modular logo">
          </div>
        </div>
      </div>
      <div class="scene__overlay" id="gridlogo-overlay"></div>
    </div>

    <!-- 5. Boat interior zoom -->
    <div class="scene" id="scene-boat">
      <div class="scene__wrapper bg-boat">
        <img id="boat-img" src="media/AGM_5.webp" alt="">
      </div>
      <div class="scene__overlay" id="boat-overlay"></div>
    </div>

    <!-- 6. Flyer reveal -->
    <div class="scene" id="scene-flyer">
      <div class="scene__wrapper bg-flyer">
        <img id="flyer-img" src="media/AGM_6.webp" alt="">
        <div class="flyer-shadow"></div>
      </div>
      <div class="scene__overlay" id="flyer-overlay"></div>
    </div>

    <!-- 7. Logo outro -->
    <div class="scene" id="scene-outro">
      <div class="scene__wrapper bg-outro">
        <img id="outro-bg" src="media/AGM_8.webp" alt="">
        <div id="outro-scrim"></div>
        <img id="outro-logo" src="media/AGM_8.2.webp" alt="">
      </div>
      <div class="scene__overlay" id="outro-overlay"></div>
    </div>

  </div>

  <script>
  (function () {
    // Keyframe interpolation, ported 1:1 from the source full-sequence.jsx timeline.
    function kf(t, stops) {
      if (t <= stops[0][0]) return stops[0][1];
      for (var i = 0; i < stops.length - 1; i++) {
        var t0 = stops[i][0], v0 = stops[i][1];
        var t1 = stops[i + 1][0], v1 = stops[i + 1][1];
        if (t <= t1) {
          var f = (t1 === t0) ? 0 : (t - t0) / (t1 - t0);
          return v0 + (v1 - v0) * f;
        }
      }
      return stops[stops.length - 1][1];
    }

    function fadeOverlay(t, fadeIn, fadeOut) {
      return kf(t, [[0, 1], [fadeIn, 0], [1 - fadeOut, 0], [1, 1]]);
    }

    // ---- Scene 1: Intro logo ----
    var introBg = document.getElementById('intro-bg');
    var introVig = document.getElementById('intro-vig');
    var introLogo = document.getElementById('intro-logo');
    var introLogoClip = document.getElementById('intro-logo-clip');
    var introOverlay = document.getElementById('intro-overlay');
    function updateIntro(t) {
      var bgOpacity = kf(t, [[0, 0], [0.15, 1], [0.85, 1], [0.95, 0], [1, 0]]);
      var bgScale = kf(t, [[0, 1.12], [0.15, 1.02], [0.5, 1.07], [0.85, 1.1], [1, 1.13]]);
      var bgTx = kf(t, [[0, 0], [0.15, -0.6], [0.5, 0.5], [0.85, 0], [1, 0]]);
      var bgTy = kf(t, [[0, 0], [0.15, 0.2], [0.5, -0.4], [0.85, 0], [1, 0]]);
      var vig = kf(t, [[0, 0.35], [0.15, 0.55], [0.5, 0.6], [0.85, 0.55], [1, 0.35]]);
      var logoOpacity = kf(t, [[0, 0], [0.14, 0], [0.34, 1], [0.8, 1], [0.92, 0], [1, 0]]);
      var logoScale = kf(t, [[0, 1.65], [0.14, 1.65], [0.34, 1], [0.8, 1], [0.92, 1.55], [1, 1.65]]);
      var logoBlur = kf(t, [[0, 30], [0.14, 30], [0.34, 0], [0.8, 0], [0.92, 24], [1, 30]]);
      var logoClip = kf(t, [[0, 0], [0.14, 0], [0.34, 85], [0.8, 85], [0.92, 0], [1, 0]]);

      introBg.style.opacity = bgOpacity;
      introBg.style.transform = 'scale(' + bgScale + ') translate(' + bgTx + '%,' + bgTy + '%)';
      introVig.style.opacity = vig;
      introLogo.style.opacity = logoOpacity;
      introLogo.style.filter = 'blur(' + logoBlur + 'px) drop-shadow(0 18px 50px rgba(0,0,0,0.55))';
      introLogoClip.style.transform = 'scale(' + logoScale + ')';
      introLogoClip.style.clipPath = 'circle(' + logoClip + '% at 50% 50%)';
      introOverlay.style.opacity = fadeOverlay(t, 0.08, 0.08);
    }

    // ---- Scene 2: Tech graphic grid ----
    var techgridLogo = document.getElementById('techgrid-logo');
    var techgridOverlay = document.getElementById('techgrid-overlay');
    function updateTechGrid(t) {
      var logoOpacity = kf(t, [[0, 0], [0.42, 0], [0.56, 1], [0.8, 1], [0.94, 0], [1, 0]]);
      var logoScale = kf(t, [[0, 0.82], [0.42, 0.82], [0.56, 1], [0.8, 1], [0.94, 1.05], [1, 1.05]]);
      techgridLogo.style.opacity = logoOpacity;
      techgridLogo.style.transform = 'scale(' + logoScale + ')';
      techgridOverlay.style.opacity = fadeOverlay(t, 0.08, 0.08);
    }

    // ---- Scene 3: Truck outside view ----
    var truckImg = document.getElementById('truck-img');
    var truckTurb = document.getElementById('truck-turb');
    var truckDisp = document.getElementById('truck-disp');
    var truckOverlay = document.getElementById('truck-overlay');
    function updateTruck(t) {
      var wave = (1 - Math.cos(2 * Math.PI * t)) / 2;
      var zoomAmount = 1.15, morphIntensity = 22;
      var scale = 1 + (zoomAmount - 1) * wave;
      var freq = 0.006 + 0.01 * wave;
      var dispScale = morphIntensity * wave;
      truckImg.style.transform = 'scale(' + scale.toFixed(4) + ')';
      truckTurb.setAttribute('baseFrequency', freq.toFixed(4) + ' ' + (freq * 1.4).toFixed(4));
      truckDisp.setAttribute('scale', dispScale.toFixed(2));
      truckOverlay.style.opacity = fadeOverlay(t, 0.08, 0.08);
    }

    // ---- Scene 4: Grid logo build ----
    var gridlogoGrid = document.getElementById('gridlogo-grid');
    var gridlogoLogoWrap = document.getElementById('gridlogo-logo-wrap');
    var gridlogoOverlay = document.getElementById('gridlogo-overlay');
    var cols = 9, rows = 5;
    var centerR = Math.ceil(rows / 2), centerC = Math.ceil(cols / 2);
    var colStart = centerC - 1, colEnd = colStart + 3;
    var rowStart = 2, rowEnd = 5;
    var lineRgba = 'rgba(255,255,255,0.5)';
    var gridCells = [];
    for (var r = 1; r <= rows; r++) {
      for (var c = 1; c <= cols; c++) {
        var inLogo = r >= rowStart && r < rowEnd && c >= colStart && c < colEnd;
        if (inLogo) continue;
        var dist = Math.max(Math.abs(r - centerR), Math.abs(c - centerC));
        var el = document.createElement('div');
        el.className = 'scene__cell';
        el.style.gridRow = r;
        el.style.gridColumn = c;
        el.style.border = '1px solid ' + lineRgba;
        gridlogoGrid.appendChild(el);
        gridCells.push({ el: el, dist: dist });
      }
    }
    function updateGridLogo(t) {
      gridCells.forEach(function (cell) {
        var delay = cell.dist * 0.025;
        var start = 0.02 + delay, end = start + 0.12;
        var op = kf(t, [[0, 0], [start, 0], [end, 1], [0.8, 1], [0.94, 0], [1, 0]]);
        var sc = 0.4 + 0.6 * op;
        cell.el.style.opacity = op;
        cell.el.style.transform = 'scale(' + sc + ')';
      });
      var logoOpacity = kf(t, [[0, 0], [0.22, 0], [0.38, 1], [0.78, 1], [0.92, 0], [1, 0]]);
      var logoScale = kf(t, [[0, 0.8], [0.22, 0.8], [0.38, 1], [0.78, 1], [0.92, 0.8], [1, 0.8]]);
      gridlogoLogoWrap.style.opacity = logoOpacity;
      gridlogoLogoWrap.style.transform = 'scale(' + logoScale + ')';
      gridlogoOverlay.style.opacity = fadeOverlay(t, 0.08, 0.08);
    }

    // ---- Scene 5: Boat interior zoom ----
    var boatImg = document.getElementById('boat-img');
    var boatOverlay = document.getElementById('boat-overlay');
    function updateBoat(t) {
      var eased = 0.5 - 0.5 * Math.cos(Math.PI * t);
      var scale = 1 + 0.14 * eased;
      var tx = -3 * eased, ty = 2 * eased;
      boatImg.style.transform = 'translate(-50%,-50%) translate(' + tx + '%,' + ty + '%) scale(' + scale + ')';
      boatOverlay.style.opacity = fadeOverlay(t, 0.08, 0.08);
    }

    // ---- Scene 6: Flyer reveal ----
    var flyerImg = document.getElementById('flyer-img');
    var flyerOverlay = document.getElementById('flyer-overlay');
    function updateFlyer(t) {
      var zf = 0.09, df = 0.28;
      var wave = Math.sin(t * Math.PI);
      var wave2 = Math.sin(t * Math.PI * 2);
      var scale = 1.12 + wave * zf * 0.22;
      var panX = wave2 * zf * 26;
      var panY = wave * zf * -16;
      var rotY = wave2 * df * 7;
      var rotX = -wave * df * 5;
      flyerImg.style.transform = 'scale(' + scale + ') translate3d(' + panX + 'px,' + panY + 'px,0) rotateX(' + rotX + 'deg) rotateY(' + rotY + 'deg)';
      flyerOverlay.style.opacity = fadeOverlay(t, 0.08, 0.08);
    }

    // ---- Scene 7: Logo outro ----
    var outroBg = document.getElementById('outro-bg');
    var outroScrim = document.getElementById('outro-scrim');
    var outroLogo = document.getElementById('outro-logo');
    var outroOverlay = document.getElementById('outro-overlay');
    function updateOutro(t) {
      var bgScale = 1 + 0.14 * t;
      var scrimOp = kf(t, [[0, 0.10], [0.14, 0.10], [0.30, 0.62], [0.5, 0.62], [0.66, 0.10], [1, 0.10]]);
      var logoOp = kf(t, [[0, 0], [0.14, 0], [0.3, 1], [0.5, 1], [0.66, 0], [1, 0]]);
      var logoBlur = kf(t, [[0, 18], [0.14, 18], [0.3, 0], [0.5, 0], [0.66, 14], [1, 18]]);
      var logoScale = kf(t, [[0, 0.82], [0.14, 0.82], [0.3, 1], [0.5, 1], [0.66, 1.1], [1, 0.82]]);
      outroBg.style.transform = 'scale(' + bgScale + ')';
      outroScrim.style.opacity = scrimOp;
      outroLogo.style.opacity = logoOp;
      outroLogo.style.filter = 'blur(' + logoBlur + 'px)';
      outroLogo.style.transform = 'translate(-50%,-50%) scale(' + logoScale + ')';
      outroOverlay.style.opacity = fadeOverlay(t, 0.08, 0.08);
    }

    // ---- Sequencer ----
    var scenes = [
      { id: 'scene-intro', dur: 5, update: updateIntro },
      { id: 'scene-techgrid', dur: 5, update: updateTechGrid },
      { id: 'scene-truck', dur: 5, update: updateTruck },
      { id: 'scene-gridlogo', dur: 5, update: updateGridLogo },
      { id: 'scene-boat', dur: 5, update: updateBoat },
      { id: 'scene-flyer', dur: 5, update: updateFlyer },
      { id: 'scene-outro', dur: 6, update: updateOutro }
    ];
    scenes.forEach(function (s) { s.el = document.getElementById(s.id); });
    var totalDur = scenes.reduce(function (sum, s) { return sum + s.dur; }, 0);
    var starts = [];
    (function () {
      var acc = 0;
      scenes.forEach(function (s) { starts.push(acc); acc += s.dur; });
    })();

    var activeIdx = -1;
    var running = true;
    var rafId = null;
    var startTime = null;

    function frame(now) {
      if (!running) return;
      if (startTime === null) startTime = now;
      var elapsed = ((now - startTime) / 1000) % totalDur;

      var idx = scenes.length - 1;
      for (var i = 0; i < scenes.length; i++) {
        if (elapsed < starts[i] + scenes[i].dur) { idx = i; break; }
      }
      var localT = Math.min(Math.max((elapsed - starts[idx]) / scenes[idx].dur, 0), 1);

      if (idx !== activeIdx) {
        scenes.forEach(function (s, j) { s.el.classList.toggle('is-active', j === idx); });
        activeIdx = idx;
      }
      scenes[idx].update(localT);

      rafId = requestAnimationFrame(frame);
    }

    function start() {
      if (rafId !== null) return;
      startTime = null;
      rafId = requestAnimationFrame(frame);
    }
    function stop() {
      running = false;
      if (rafId !== null) { cancelAnimationFrame(rafId); rafId = null; }
    }

    document.addEventListener('visibilitychange', function () {
      if (document.hidden) {
        stop();
      } else {
        running = true;
        start();
      }
    });

    start();
  })();
  </script>
</body>
</html>
